<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Chapter discovery pins · Public Docket</title>
    <meta
      name="description"
      content="Public Docket chapter discovery pins — non-starter teach-in fixtures. Opt-in only. Not Most Wanted. Not city-game discovery default."
    />
    <meta property="og:title" content="Chapter discovery pins · Public Docket" />
    <meta
      property="og:description"
      content="C-v3 publish surface for chapter commons pins — branch only, starter-four stay off discovery."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://humanity.llc/docket/chapters/" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/assets/red_qr_transparent_bg.png" type="image/png" />
    <script>
      (function () {
        try {
          if (localStorage.getItem("hc_theme") === "dark") {
            document.documentElement.dataset.theme = "dark";
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=163" />
    <link rel="stylesheet" href="/css/docket.css?v=10" />
    <link rel="stylesheet" href="/css/theme-dark.css?v=32" />
  </head>
  <body class="page-docket">
    <div class="page docket-page">
      <header class="top docket-top">
        <a class="top-brand" href="/">
          <span class="pass-dot" aria-hidden="true"></span>
          <span>humanity.llc</span>
        </a>
        <a class="docket-top-charter" href="/docket/#charter">Charter</a>
      </header>

      <main class="screen docket-screen">
        <header class="docket-list-head">
          <p class="docket-kicker">Public Docket · branch</p>
          <h1>Chapter discovery pins</h1>
          <p class="docket-list-lead">
            Opt-in chapter fixtures for teach-ins and commons — not Most Wanted cases, not the
            homepage front door, not city-game stranger discovery.
          </p>
        </header>

        <p class="form-hint" id="docket-chapter-pins-status" role="status">
          Loading chapter pins…
        </p>
        <div id="docket-chapter-pins-body">
          <noscript>
            <p class="form-hint">
              Enable JavaScript to load chapter pins, or open
              <a href="/data/docket-chapter-discovery-pins.json">the registry JSON</a>.
            </p>
          </noscript>
        </div>

        <p class="form-hint docket-case-back">
          <a href="/docket/">← Most Wanted list</a>
          ·
          <a href="/docket/goods/research-kit/">Research kit</a>
          ·
          <a href="/docket/#charter">Charter</a>
        </p>
      </main>
    </div>
    <script type="module" src="/js/docket-chapter-pins-page.mjs?v=1"></script>
  </body>
</html>
